.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-height: 260px }

.q { font: 600 1.12rem/1.45 var(--f-body); margin: 0; text-wrap: pretty }
.term { font: 700 1.55rem/1.25 var(--f-head); margin: 0; text-wrap: balance }
.answer { border-top: 1px dashed var(--line); padding-top: 14px; font-size: 1.02rem }

const DATA = [{"id": "01-Grundlagen-Bayes", "titel": "Grundlagen & Bayes", "kapitel": "kapitel/01-Bayes-Schlussfolgern.md", "karten": [["Prior", "Verteilung, die das Wissen bzw. die Annahme über einen Parameter θ VOR Betrachtung der Daten beschreibt."], ["Likelihood", "p(Daten | θ): wie gut die beobachteten Daten zu einem bestimmten Parameterwert passen."], ["Posterior", "p(θ | Daten): aktualisierte Verteilung des Parameters nach den Daten; kombiniert Prior und Likelihood (Posterior ∝ Likelihood × Prior)."], ["Evidenz p(Y)", "Normierungskonstante im Satz von Bayes, damit der Posterior sich zu 1 summiert."], ["Basisrate", "Grundhäufigkeit eines Ereignisses (z. B. 1 % krank). Bestimmt stark, wie viel ein positiver Test bedeutet."], ["Satz von Bayes", "p(A|B) = p(B|A)·p(A) / p(B)"], ["Schwach-informativer Prior", "Prior, der unplausible Werte ausschließt und die Berechnung stabilisiert, aber das Ergebnis kaum beeinflusst (rstanarm-Default normal(0, 2.5) auf z-Skala)."], ["Prozentpunkte vs. Prozent", "10 % → 15 % sind +5 Prozentpunkte, aber +50 %."], ["z-Transformation", "z = (x − Mittelwert)/SD → Mittelwert 0, SD 1; macht Variablen vergleichbar."], ["Zentrieren", "Einen Referenzwert (oft den Mittelwert) abziehen, damit x = 0 ein sinnvoller Basisfall wird."], ["pnorm / qnorm", "pnorm(x) = P(X ≤ x) (Verteilungsfunktion); qnorm(p) = Quantil (Umkehrung), z. B. qnorm(0.975) ≈ 1.96."], ["p-Wert", "Wahrscheinlichkeit, solche oder extremere Daten zu beobachten, WENN die Nullhypothese stimmt. Nicht: Wahrscheinlichkeit, dass die Hypothese stimmt."]], "fragen": [{"q": "Ein Test erkennt 90 % der Kranken, schlägt bei 5 % der Gesunden falsch an, 1 % sind krank. Wie groß ist p(krank | positiv) ungefähr?", "o": ["90 %", "50 %", "15 %", "1 %"], "a": 2, "e": "0.9·0.01 / (0.9·0.01 + 0.05·0.99) = 0.009/0.0585 ≈ 0.154. Die niedrige Basisrate dominiert."}, {"q": "Was passiert mit dem Anteil echter Alarme, wenn die Basisrate (Defektquote) steigt, die Prüfmaschine aber gleich bleibt?", "o": ["Er sinkt", "Er steigt", "Er bleibt gleich", "Er wird 50 %"], "a": 1, "e": "Mehr echte Defekte → mehr TP relativ zu FP → p(defekt|Alarm) steigt."}, {"q": "80 % von 20 Befragten stimmen zu. Ein starker Prior liegt bei 50 %. Wo liegt der Posterior-Modus typischerweise?", "o": ["genau bei 80 %", "zwischen 50 % und 80 %", "genau bei 50 %", "über 80 %"], "a": 1, "e": "Der Posterior ist ein Kompromiss aus Prior und Likelihood; bei wenigen Daten hat der Prior Gewicht."}, {"q": "Man verwendet den Posterior als Prior und füttert DIESELBEN 50 Antworten noch einmal ein. Was ist richtig?", "o": ["Das ist ein legitimes Update", "Das Intervall wird enger, aber es täuscht Präzision vor – keine neue Information", "Der Posterior bleibt unverändert", "Das Intervall wird breiter"], "a": 1, "e": "Daten doppelt zu verwenden erzeugt falsche Sicherheit (Verständnisaufgabe 03)."}, {"q": "Welche Aussage über Priors ist korrekt?", "o": ["Priors dürfen nach dem gewünschten Ergebnis gewählt werden", "Priors müssen fachlich begründet sein; in der LV werden schwach-informative Defaults verwendet", "Priors haben nie Einfluss", "Bayes funktioniert ohne Prior"], "a": 1, "e": "Ein Prior ist eine Modellannahme, die man rechtfertigen muss."}, {"q": "Eine Quote steigt von 20 % auf 30 %. Wie lautet die korrekte Beschreibung?", "o": ["+10 %", "+10 Prozentpunkte bzw. +50 %", "+50 Prozentpunkte", "+30 %"], "a": 1, "e": "Differenz 10 Prozentpunkte; relativ 10/20 = +50 %."}, {"q": "Was beschreibt der Posterior im Unterschied zum frequentistischen p-Wert?", "o": ["p(Daten | Hypothese)", "p(Parameter | Daten)", "die Stichprobengröße", "die Likelihood allein"], "a": 1, "e": "Bayes liefert direkt eine Verteilung über plausible Parameterwerte gegeben die Daten."}, {"q": "Etwa welcher Anteil einer Normalverteilung liegt innerhalb ±2 SD?", "o": ["68 %", "95 %", "99.7 %", "50 %"], "a": 1, "e": "Faustregel 68–95–99.7."}]}, {"id": "02-Lineare-Regression", "titel": "Lineare Regression (stan_glm)", "kapitel": "kapitel/02-Lineare-Regression-Bayes.md", "karten": [["Basisfall (Intercept)", "Vorhersage, wenn alle metrischen Variablen = 0 (bzw. Zentrierwert) und alle Faktoren auf ihrer Referenzgruppe (erstes Level) sind."], ["Referenzgruppe", "Erstes Faktorlevel (meist alphabetisch); bekommt keinen eigenen Koeffizienten. Ändern mit relevel(x, ref=…)."], ["Metrischer Koeffizient", "Unterschied in y bei +1 Einheit x, bei sonst gleichen Werten der anderen Variablen (Vergleich, keine Intervention)."], ["Gruppenkoeffizient", "Unterschied der Gruppe zur Referenzgruppe bei sonst gleichen Werten; verschiebt die Gerade parallel."], ["MAD_SD", "Robuste Streuung der Posterior-Verteilung eines Koeffizienten; entspricht etwa dem Standardfehler."], ["HDI", "Highest Density Interval: kürzestes Intervall, das 95 % der Posterior-Wahrscheinlichkeit enthält (daatools hdi(), lwr/upr in info())."], ["sigma", "Standardabweichung der Residuen: typische Abweichung einzelner Beobachtungen von der Modellvorhersage (≈95 % in ±2σ)."], ["log(y)-Modell", "Koeffizienten wirken multiplikativ: +1 x → y × e^β; ≈ 100·(e^β−1) % Unterschied. exp(Intercept) = Median im Basisfall."], ["Omitted Variable Bias", "Verzerrung eines Koeffizienten, weil eine relevante, mit x korrelierte Variable fehlt (z. B. streams ohne year)."], ["Extrapolation", "Vorhersage außerhalb des Datenbereichs; der Zusammenhang muss dort nicht mehr gelten."], ["4000 Samples", "Default rstanarm: 4 Chains × 1000 Samples nach Warmup → jede Größe hat eine Verteilung aus 4000 Werten."], ["prior_summary()", "Zeigt die verwendeten Priors (specified auf z-Skala, adjusted auf Originalskala)."]], "fragen": [{"q": "Modell: Weight ~ Height + Age + Gender (nicht zentriert). Was ist der Basisfall?", "o": ["Durchschnittliche Person", "Frau, 0 cm, 0 Jahre", "Mann, 170 cm, 30 Jahre", "Frau mit mittlerer Größe"], "a": 1, "e": "Alle metrischen = 0, Gender auf Referenz (Female). Sinnlos → zentrieren."}, {"q": "Koeffizient Height170 = 0.73. Welche Interpretation ist korrekt rieren einer Variable?", "o": ["Die Vorhersagen", "Steigung und R²", "Bedeutung (und Wert) des Intercepts; Steigungen bleiben gleich", "Nichts"], "a": 2, "e": "Nur der Referenzpunkt verschiebt sich (ohne Interaktion bleiben Steigungen identisch)."}, {"q": "Welche Funktion zeigt median, mad, HDI, mcse, n_eff und Rhat auf einen Blick?", "o": ["summary()", "info() aus daatools", "plot()", "loo()"], "a": 1, "e": "info(modell)."}, {"q": "Warum ändert sich der Koeffizient von streams, wenn year ins Modell kommt?", "o": ["Sampling-Fehler", "Weil der Koeffizient immer bedingt auf die anderen Variablen ist – ohne year steckte der Zeittrend teilweise in streams", "Weil R² sinkt", "Weil sich die Daten ändern"], "a": 1, "e": "Omitted Variable Bias."}]}, {"id": "03-Modellpruefung", "titel": "Modellprüfung & MCMC", "kapitel": "kapitel/03-Modellpruefung-MCMC.md", "karten": [["Die 4 Prüffragen", "1) Sampling ok? 2) Reproduziert das Modell die Daten? 3) Systematische Fehler? 4) Generalisierung auf neue Daten?"], ["Rhat", "Vergleicht die Chains; ≈ 1 gut, > 1.1 problematisch (Chains nicht konvergiert)."], ["n_eff", "Effektive Anzahl unabhängiger Samples; > 2000 gut, < 400 schlecht."], ["mcse", "Monte-Carlo-Standardfehler = numerische Ungenauigkeit; sollte < 5 % des mad sein."], ["Traceplot", "Verlauf der Chains; gut = 'haariges Rauschen', alle Chains überlappen, kein Trend."], ["mean_PPD", "Mittelwert der posterior-predictive Daten; sollte ≈ Mittelwert von y sein."], ["diagnose_density", "Dichte der echten Daten vs. simulierter Datensätze (Posterior Predictive Check)."], ["diagnose_fit", "Vergleicht Statistiken (min, max, Mittelwert, Quantile) der Daten mit den 4000 replizierten Datensätzen."], ["Banane im Residuenplot", "Hinweis auf fehlende Nichtlinearität → quadratischer Term, log oder Spline."], ["Trichter im Residuenplot", "Streuung nicht konstant (Heteroskedastizität) → Vorhersageintervalle teils zu eng/zu weit."], ["Skill (metrisch)", "1 − MSE_Modell / MSE_Mittelwertmodell; 0 = nicht besser als Mittelwert."], ["Overfitting", "Modell passt Trainingsdaten (inkl. Zufall) zu gut, Testfehler deutlich größer als Trainingsfehler."]], "fragen": [{"q": "Rhat = 1.15, n_eff = 80, Chains liegen in verschiedenen Bereichen. Diagnose?", "o": ["Modell ist fehlspezifiziert", "Das Sampling hat nicht funktioniert – Ergebnisse nicht vertrauenswürdig", "Alles ok", "Overfitting"], "a": 1, "e": "Berechnungsproblem (Verständnisaufgabe 08)."}, {"q": "Sampling perfekt, aber U-förmige Residuen. Diagnose?", "o": ["Berechnungsproblem", "Modellproblem: Nichtlinearität fehlt", "Zu wenige Samples", "Kein Problem"], "a": 1, "e": "Gutes Sampling ≠ gutes Modell."}, {"q": "Was bringt es, 40 000 statt 4 000 Samples zu ziehen?", "o": ["Zehnmal so viele Daten", "Deutlich schmalere Intervalle", "Genauere numerische Näherung (kleinerer mcse), aber kaum schmalere Intervalle", "Höheres R²"], "a": 2, "e": "Die Datenmenge bleibt gleich (Verständnisaufgabe 07)."}, {"q": "Der Gesamtmittelwert der Vorhersagen passt, aber Typ A wird über- und Typ B unterschätzt. Was folgt?", "o": ["Modell ist gut", "Fehler gleichen sich aus – Untergruppen prüfen, Variable 'Typ' aufnehmen", "Mehr Samples ziehen", "Prior ändern"], "a": 1, "e": "Verständnisaufgabe 09."}, {"q": "Die Streuung der Residuen wächst mit der Entfernung. Welche Annahme ist verletzt?", "o": ["Linearität", "Konstante Residuenstreuung σ", "Unabhängigkeit der Chains", "Normalverteilter Prior"], "a": 1, "e": "Folge: Intervalle für große Entfernungen zu eng."}, {"q": "Testfehler RMSE 5.2, Trainingsfehler RMSE 5.1. Interpretation?", "o": ["Overfitting", "Gute Generalisierung auf ähnliche Daten", "Modell unbrauchbar", "Sampling-Fehler"], "a": 1, "e": "Test ≈ Training."}, {"q": "Skill = −0.1 auf Testdaten bedeutet …", "o": ["Sehr gutes Modell", "Modell ist schlechter als immer den Mittelwert vorherzusagen", "10 % erklärt", "Rundungsfehler"], "a": 1, "e": "Skill < 0 → schlechter als Baseline."}, {"q": "Welcher Plot zeigt echte y gegen vorhergesagte ŷ?", "o": ["diagnose_density", "diagnose_y_vs_yhat", "plotcoef", "mcmc_trace"], "a": 1, "e": "Ideal: Punkte entlang der Diagonale."}, {"q": "Was zeigt plotcorr(model)?", "o": ["Korrelationen der Daten", "Korrelationen der Posterior-Samples der Koeffizienten", "Residuen", "ROC"], "a": 1, "e": "Hohe Parameterkorrelation → Zentrieren hilft."}, {"q": "mean_PPD = 31.4, Mittelwert von y = 31.5. Was sagt das?", "o": ["Overfitting", "Das Modell reproduziert den Mittelwert der Daten", "Sampling kaputt", "R² = 0.99"], "a": 1, "e": "Teil von Prüffrage 2."}]}, {"id": "04-Vorhersage-Entscheidung", "titel": "Vorhersagen & Entscheidungen", "kapitel": "kapitel/04-Vorhersagen-Entscheidungen.md", "karten": [["predict()", "Punktvorhersage (Median), ohne Unsicherheit."], ["posterior_epred()", "4000 Samples des Erwartungswerts (Mittelwert vergleichbarer Fälle); nur Koeffizienten-Unsicherheit. Bei logistisch: Wahrscheinlichkeiten."], ["posterior_predict()", "4000 Samples einzelner neuer Beobachtungen; Koeffizienten-Unsicherheit + Fehlerterm ε. Bei logistisch: 0/1."], ["Zwei Unsicherheitsquellen", "1) Koeffizienten (sinkt mit mehr Daten) 2) Fehlerterm ε/σ (bleibt immer)."], ["Differenz mit Samples", "Immer zeilenweise im selben Sample bilden: d = pred[,2] − pred[,1]; nie Intervallgrenzen kombinieren."], ["Optimales Quantil", "Bei Kosten c_unter für Unterschätzen und c_über für Überschätzen: Quantil c_unter / (c_unter + c_über) der predict-Verteilung."], ["rowSums(posterior_predict(...))", "Summe über viele Einzelfälle pro Sample → Verteilung einer Gesamtmenge (z. B. Gesamtgewicht eines Flugzeugs)."], ["Vorhersage ≠ Entscheidung", "Die wahrscheinlichste Menge ist nicht automatisch die kostenoptimale; Entscheidung minimiert erwartete Kosten."]], "fragen": [{"q": "Eine Kundin fragt: 'Wann kommt MEINE Lieferung?' Welche Funktion liefert das passende Intervall?", "o": ["predict", "posterior_epred", "posterior_predict", "loo"], "a": 2, "e": "Einzelfall → inkl. ε."}, {"q": "Wären die Koeffizienten exakt bekannt, wie breit wäre das epred-Intervall?", "o": ["±2σ", "ein Punkt (Breite 0)", "unendlich", "gleich breit wie predict"], "a": 1, "e": "epred enthält nur die Koeffizienten-Unsicherheit (Verständnisaufgabe 11)."}, {"q": "Intervalle A [20; 35] und B [22; 37] überlappen. In jedem Sample ist aber B − A zwischen 1 und 3. Was gilt?", "o": ["Kein Unterschied, weil Überlappung", "Klarer Unterschied: B ist in allen Samples größer", "Unterschied −15 bis +17", "Unentscheidbar"], "a": 1, "e": "Verständnisaufgabe 12: gemeinsame Posterior-Struktur zählt."}, {"q": "Fehlende Essen kosten 3 €, überzählige 1 €. Welches Quantil der Nachfrageverteilung sollte man vorbereiten?", "o": ["50 %", "25 %", "75 %", "90 %"], "a": 2, "e": "3/(3+1) = 0.75."}, {"q": "Man bereitet 120 Essen vor (optimal), gebraucht werden nur 80. War die Entscheidung falsch?", "o": ["Ja, 80 wäre richtig gewesen", "Nein – sie minimierte die erwarteten Kosten unter Unsicherheit", "Ja, immer Median nehmen", "Nur wenn die Kosten symmetrisch sind"], "a": 1, "e": "Entscheidungen bewertet man ex ante, nicht am Einzelausgang."}, {"q": "Was liefert posterior_epred bei einem logistischen Modell?", "o": ["0/1-Werte", "Wahrscheinlichkeiten mit Unsicherheit", "Logits", "Odds-Ratios"], "a": 1, "e": "Erwartungswert von y = p."}, {"q": "Wie berechnet man P(Mann wiegt > 90 kg) aus pred = posterior_predict(...)?", "o": ["predict(m) > 90", "mean(pred[,2] > 90)", "sum(pred > 90)", "hdi(pred)"], "a": 1, "e": "Anteil der Samples über 90."}, {"q": "Warum ist das posterior_predict-Intervall breiter als das epred-Intervall?", "o": ["Mehr Samples", "Es enthält zusätzlich die Residuenstreuung σ", "Anderer Prior", "Rundung"], "a": 1, "e": "≈ ±2σ breiter."}]}, {"id": "05-Simpson-Kausalitaet", "titel": "Simpson & Kausalität", "kapitel": "kapitel/05-Simpson-Kausalitaet.md", "karten": [["Simpsons Paradox", "Ein Zusammenhang in jeder Untergruppe kehrt sich in der Gesamtbetrachtung um, weil die Gruppen unterschiedlich zusammengesetzt sind."], ["Confounder", "Variable, die X und Y beeinflusst (X ← C → Y). Sollte kontrolliert werden."], ["Mediator", "Liegt auf dem Wirkungsweg X → M → Y. Nicht kontrollieren, wenn die Gesamtwirkung gefragt ist."], ["Collider", "Wird von X und Y beeinflusst (X → C ← Y). Nicht darauf selektieren/kontrollieren – erzeugt Scheinzusammenhänge."], ["Kontrollvariable", "Variable im Modell, damit Koeffizienten Vergleiche bei gleichen Werten dieser Variable beschreiben."], ["Randomisiertes Experiment", "Zufällige Zuteilung der Behandlung → Confounder im Mittel ausgeglichen → kausale Aussagen möglich."], ["Assoziation vs. Intervention", "Regression aus Beobachtungsdaten beschreibt Unterschiede zwischen Einheiten, nicht was passiert, wenn man X bei einer Einheit ändert."], ["Die 5 Fragen", "Was wird verglichen? Was konstant gehalten? Ist das sinnvoll? Was fehlt? Assoziation oder kausal?"]], "fragen": [{"q": "Team A hat in leichten UND schweren Fällen die niedrigere Komplikationsrate, aber insgesamt die höhere. Warum?", "o": ["Rechenfehler", "A operiert überwiegend schwere Fälle (andere Fallmischung)", "B ist besser", "Zu wenige Daten"], "a": 1, "e": "Simpsons Paradox."}, {"q": "zimmer ist allein +30 000 €, mit wohnflaeche im Modell −10 000 €. Welches Ergebnis ist richtig?", "o": ["Nur das erste", "Nur das zweite", "Beide – sie beantworten verschiedene Fragen", "Keines"], "a": 2, "e": "Allgemein mehr Zimmer vs. mehr Zimmer bei gleicher Fläche."}, {"q": "Folgt aus −10 000 € (bei gleicher Fläche), dass das Entfernen einer Zwischenwand den Wert um 10 000 € erhöht?", "o": ["Ja", "Nein – das ist eine Intervention, Beobachtungsdaten zeigen nur Unterschiede zwischen Wohnungen", "Nur bei Bayes", "Ja, wenn das HDI 0 ausschließt"], "a": 1, "e": "Verständnisaufgabe 15."}, {"q": "Effekt eines Kurses auf die Leistung: Welche Rolle hat 'Vorerfahrung' (beeinflusst Kursteilnahme und Leistung)?", "o": ["Mediator", "Collider", "Confounder", "Instrument"], "a": 2, "e": "Kontrollieren."}, {"q": "'Im Kurs erworbene Kenntnisse' sind …", "o": ["Confounder", "Mediator – nicht kontrollieren für die Gesamtwirkung", "Collider", "irrelevant"], "a": 1, "e": "Kurs → Kenntnisse → Leistung."}, {"q": "Man analysiert nur Mitglieder einer Projektgruppe, in die man mit Kurszertifikat ODER hoher Motivation kommt. Problem?", "o": ["Kein Problem", "Collider-Bias: Selektion erzeugt künstlichen Zusammenhang", "Confounding durch Alter", "Zu viele Daten"], "a": 1, "e": "Collider (Verständnisaufgabe 16)."}, {"q": "Smart-Thermostat: roh −8.6 kWh, mit Dämmung im Modell −2.6 kWh. Warum?", "o": ["Sampling", "Smart-Thermostate sind häufiger in gut gedämmten Häusern – Dämmung ist Confounder", "Interaktion", "Overfitting"], "a": 1, "e": "Probeklausur B."}, {"q": "Wie kann man kausal prüfen, ob höherer Druck Defekte verursacht?", "o": ["Mehr Beobachtungsdaten", "Kontrolliertes Experiment mit zufälliger Zuteilung von Druckstufen", "Höheres R²", "LOO"], "a": 1, "e": "Design of Experiments."}]}, {"id": "06-Effektgroesse", "titel": "Effektgröße", "kapitel": "kapitel/06-Effektgroesse.md", "karten": [["Cohens d", "Mittelwertsunterschied in Standardabweichungen; 0.2 klein, 0.5 mittel, 0.8 groß."], ["f²", "(R²_mit − R²_ohne)/(1 − R²_mit): Anteil der unerklärten Varianz, den eine Variable zusätzlich erklärt; 0.02/0.15/0.35."], ["effectsize() linear", "Drop-one-Tabelle mit Df, RSS, AIC, R2, f2; sortiert nach f2."], ["effectsize() logistisch", "Drop-one-Tabelle mit Df, Deviance, AIC; größerer AIC-Anstieg = wichtigere Variable (unten)."], ["Df in effectsize", "Anzahl gemeinsam entfernter Koeffizienten (Faktor-Dummies, Interaktionen, quadratische Terme)."], ["Statistische Sicherheit vs. Effektgröße", "Ein Effekt kann sehr sicher (enges Intervall) aber winzig sein – bei großen n."], ["Korrelierte Prädiktoren", "Teilen sich Erklärungskraft; beim Weglassen übernimmt die andere → beide wirken einzeln klein."], ["Standardisierter Koeffizient", "Effekt pro 1 SD der Variable (β·SD), macht Variablen verschiedener Einheiten vergleichbar."]], "fragen": [{"q": "R² mit x = 0.60, ohne x = 0.55. f² = ?", "o": ["0.05", "0.125", "0.083", "0.55"], "a": 1, "e": "0.05/0.40 = 0.125."}, {"q": "f² = 0.125 bedeutet …", "o": ["x erklärt 12.5 % der Gesamtvarianz", "Die zusätzlich erklärte Varianz (5 Prozentpunkte) beträgt 12.5 % der im vollen Modell unerklärten Varianz (40 %) – klein bis mittel", "x ist kausal", "12.5 % Fehler"], "a": 1, "e": "Nicht als '% erklärt' lesen (Verständnisaufgabe 18)."}, {"q": "500 000 Beobachtungen, Unterschied 0.2 kg, HDI [0.15; 0.25]. Was gilt?", "o": ["Großer Effekt", "Sicher von 0 verschieden, aber praktisch winzig", "Unsicher", "Kausal"], "a": 1, "e": "Verständnisaufgabe 17."}, {"q": "In einer logistischen effectsize-Tabelle steigt der AIC ohne machine um 160, ohne exposure_time um 25. Was folgt?", "o": ["exposure_time ist wichtiger", "machine trägt im Modell deutlich mehr zur Erklärung bei", "Beide gleich", "machine ist kausal"], "a": 1, "e": "Größerer AIC-Anstieg = wichtiger."}, {"q": "exposure_time hat den betragsmäßig größten Koeffizienten (−5.2). Ist es die wichtigste Variable?", "o": ["Ja", "Nein – der Koeffizient hängt von der Einheit (Sekunden, Spannweite 0.5 s) ab", "Ja, weil negativ", "Nur bei Bayes"], "a": 1, "e": "Rohe Koeffizienten nicht vergleichbar."}, {"q": "Warum hat 'temp5' in effectsize(m3) Df = 3?", "o": ["Drei Chains", "temp5 wird zusammen mit seinen 2 Interaktionstermen entfernt", "Drei Ausreißer", "Rundung"], "a": 1, "e": "Interaktionen werden mitentfernt."}, {"q": "Ab welchem f² spricht man nach Cohen von einem großen Effekt?", "o": ["0.02", "0.15", "0.35", "0.8"], "a": 2, "e": "0.8 ist der Richtwert für Cohens d."}, {"q": "Zwei stark korrelierte Variablen zeigen jeweils kleines f². Was ist möglich?", "o": ["Beide sind unwichtig", "Gemeinsam sind sie wichtig; jede übernimmt beim Weglassen der anderen deren Rolle", "Fehler in effectsize", "Overfitting"], "a": 1, "e": "Verständnisaufgabe 19."}]}, {"id": "07-Interaktionen", "titel": "Interaktionen & Nichtlinearität", "kapitel": "kapitel/07-Interaktionen-Nichtlinearitaet.md", "karten": [["Interaktion", "Die Wirkung von x hängt vom Wert einer anderen Variable ab (unterschiedliche Steigungen). In R: x * g = x + g + x:g."], ["Haupteffekt x bei Interaktion", "Steigung von x NUR in der Referenzgruppe (bzw. bei x₂ = 0)."], ["Gruppeneffekt bei Interaktion", "Unterschied zur Referenzgruppe NUR am Referenzpunkt x = 0 (Zentrierwert)."], ["Interaktionskoeffizient x:G", "Um so viel ist die Steigung in G anders als in der Referenz. Steigung in G = β_x + β_x:G."], ["Gruppenunterschied bei x = c", "β_G + β_x:G · c"], ["Referenzpunkt", "Wert, an dem Haupteffekte gemessen werden; durch Zentrieren wählbar, ändert die Vorhersagen nicht."], ["Quadratischer Term", "(x − Ziel)² modelliert ein Optimum (U-Form bei β₂ > 0)."], ["Scheitelpunkt", "Bei β₁·x + β₂·(x − c)²: x* = c − β₁/(2β₂)."]], "fragen": [{"q": "temp5 = −1.58, temp5:daemmungneu = +1.05. Steigung bei neuer Dämmung?", "o": ["+1.05", "−1.58", "−0.53", "−2.63"], "a": 2, "e": "−1.58 + 1.05."}, {"q": "daemmungneu = −15.25 im Interaktionsmodell (temp5 = temp − 5). Was bedeutet das?", "o": ["Durchschnittlicher Unterschied über alle Temperaturen", "Unterschied neu − alt bei 5 °C", "Unterschied bei 0 °C", "Steigung"], "a": 1, "e": "Referenzpunkt temp5 = 0 → 5 °C."}, {"q": "Unterschied neu − alt bei 0 °C (temp5 = −5)?", "o": ["−15.25", "−20.5", "−10.0", "+5.25"], "a": 1, "e": "−15.25 + 1.05·(−5) = −20.5."}, {"q": "Nach Aufnahme der Interaktion sinkt daemmungneu von −17.2 auf −15.3. 'Die Dämmung wirkt schwächer.' Richtig?", "o": ["Ja", "Nein – die Bedeutung des Koeffizienten hat sich geändert (Unterschied am Referenzpunkt)", "Ja, wegen Overfitting", "Nur bei kleinen n"], "a": 1, "e": "Haupteffekte bei Interaktionen nie isoliert interpretieren."}, {"q": "Was ändert Zentrieren in einem Interaktionsmodell?", "o": ["Die Vorhersagen", "Die Interaktionskoeffizienten", "Die Haupteffekte (sie werden an einem anderen Referenzpunkt gemessen)", "Nichts"], "a": 2, "e": "Vorhersagen und Interaktionskoeffizient bleiben gleich."}, {"q": "Logistisches Modell ohne Interaktion: Die Wahrscheinlichkeitskurven für M1 und M5 haben unterschiedliche Formen. Liegt eine Interaktion vor?", "o": ["Ja", "Nein – auf Logit-Skala sind sie parallel; die Logit-Transformation erzeugt die Formunterschiede", "Nur bei M5", "Unklar"], "a": 1, "e": "Verständnisaufgabe 27, Beispielklausur 4.5."}, {"q": "Scheitelpunkt für exposure_time: linear −5.48, quadratisch 42, Ziel 1.05?", "o": ["1.05", "≈1.115", "≈0.98", "≈1.5"], "a": 1, "e": "1.05 − (−5.48)/(84) ≈ 1.115."}, {"q": "Woran erkennt man, dass ein quadratischer Term nötig sein könnte?", "o": ["Rhat > 1.1", "Bananenförmige Residuen / U-förmige Zusammenhänge", "Hohe n_eff", "Kleines σ"], "a": 1, "e": "Systematischer Fehler."}]}, {"id": "08-Modellvergleich", "titel": "Modellvergleich (LOO)", "kapitel": "kapitel/08-Modellvergleich-LOO.md", "karten": [["LOO", "Leave-One-Out-Kreuzvalidierung, approximiert mit PSIS aus den Posterior-Samples (loo())."], ["elpd", "Expected log pointwise predictive density: Vorhersagegüte für ausgelassene Punkte; größer = besser."], ["looic", "= −2·elpd; kleiner = besser."], ["loo_compare", "Bestes Modell oben mit 0; andere zeigen elpd_diff (negativ) und se_diff."], ["2·se-Regel", "|elpd_diff| > 2·se_diff → relevanter Unterschied."], ["Pareto k", "< 0.7 ok; 0.7–1 problematisch; > 1 sehr schlecht (einflussreiche Beobachtungen)."], ["p_loo", "Effektive Anzahl Parameter."], ["AIC", "Deviance + 2·Parameterzahl; kleiner = besser; ΔAIC/2 ≈ elpd-Differenz."]], "fragen": [{"q": "loo_compare: m1 elpd_diff −222.8, se_diff 24.0. Ergebnis?", "o": ["Kein klarer Unterschied", "m2 ist klar besser (> 9 se)", "m1 ist besser", "Ungültig"], "a": 1, "e": "222.8 > 2·24."}, {"q": "elpd_diff −3.1, se_diff 2.5. Was folgt?", "o": ["Deutlicher Unterschied", "Kein überzeugender Unterschied – einfacheres Modell vertretbar", "Modelle identisch", "Pareto-Problem"], "a": 1, "e": "3.1 < 5."}, {"q": "Darf man ein Modell für y mit einem für log(y) per loo_compare vergleichen?", "o": ["Ja", "Nein – andere Skala der Zielvariable", "Nur bei gleichen Prädiktoren", "Nur bei Bayes"], "a": 1, "e": "Gleiche y-Variable nötig."}, {"q": "Ein Modell verliert wegen NAs 50 Zeilen. Vergleich per LOO?", "o": ["Gültig", "Ungültig – gleiche Datenzeilen nötig", "Gültig mit Korrektur", "Nur AIC"], "a": 1, "e": "Verständnisaufgabe 23/24."}, {"q": "Viele Beobachtungen mit Pareto k > 1. Bedeutung?", "o": ["Sehr gutes Modell", "LOO-Approximation unzuverlässig; einflussreiche Punkte/Fehlspezifikation prüfen", "Overfitting ausgeschlossen", "Sampling perfekt"], "a": 1, "e": "Dann kfold oder Refits."}, {"q": "Warum reicht R² für den Modellvergleich nicht?", "o": ["R² ist immer 1", "R² steigt fast immer mit mehr Variablen (Overfitting) und misst nicht die Vorhersage neuer Daten", "R² ist bayesianisch", "R² ist negativ"], "a": 1, "e": "Deshalb Testdaten/LOO."}, {"q": "Welches Modell steht in loo_compare ganz oben?", "o": ["Das komplexeste", "Das mit dem höchsten elpd (bestes)", "Das erste übergebene", "Das mit dem kleinsten R²"], "a": 1, "e": "elpd_diff = 0."}, {"q": "AIC sinkt von 2671 auf 2227. Etwa welche elpd-Differenz erwartet man?", "o": ["444", "222", "44", "2227"], "a": 1, "e": "ΔAIC/2."}]}, {"id": "09-Logistische-Regression", "titel": "Logistische Regression", "kapitel": "kapitel/09-Logistische-Regression.md", "karten": [["Odds", "p/(1 − p); p = 0.2 → Odds 0.25."], ["Logit", "log(Odds); Bereich −∞ bis +∞; logit 0 ↔ p = 0.5."], ["Rückrechnung", "p = e^logit/(1 + e^logit) = plogis(logit)."], ["Odds-Ratio", "e^β: Faktor, um den sich die Odds bei +1 Einheit x ändern (bei sonst gleichen Werten)."], ["Faustregel β/4", "Maximale Änderung von p pro Einheit x (bei p ≈ 0.5)."], ["Brier-Score", "mean((y − p)²); 0 perfekt; Nullmodell p̄(1 − p̄)."], ["LogLoss", "−mean(y log p + (1−y) log(1−p)); bestraft sichere Fehlprognosen stark."], ["Brier-Skill", "1 − Brier/Brier_Null."], ["AUC", "Wahrscheinlichkeit, dass ein zufälliges positives Beispiel ein höheres p bekommt als ein zufälliges negatives; 0.5 = Zufall."], ["TPR / Sensitivität", "TP/(TP + FN): Anteil erkannter Positiver."], ["FPR", "FP/(FP + TN): Anteil fälschlich markierter Negativer."], ["Precision", "TP/(TP + FP): Anteil echter Positiver unter den Alarmen."], ["Kalibrierung", "Stimmen vorhergesagte Wahrscheinlichkeiten mit beobachteten Raten überein?"], ["Separation", "Eine Variable trennt 0/1 (fast) perfekt → Koeffizient extrem; oft Leakage."], ["plotlogrates / logistic_rates", "Raten (TPR, FPR, …) in Abhängigkeit vom Cutoff; ohne newdata = Trainingsdaten!"], ["Kostenoptimaler Cutoff (kalibriert)", "markieren, wenn p > c_FP/(c_FP + c_FN)."]], "fragen": [{"q": "Logit = −0.43. p ≈ ?", "o": ["0.43", "0.39", "0.61", "0.65"], "a": 1, "e": "e^−0.43 = 0.65 → 0.65/1.65 ≈ 0.39."}, {"q": "shiftNight = 1.41 → e^1.41 ≈ 4.1. Richtige Aussage?", "o": ["Defekte in der Nacht 4.1-mal so wahrscheinlich", "Odds auf Defekt in der Nacht ≈ 4.1-mal so hoch wie am Tag (bei sonst gleichen Werten)", "+141 Prozentpunkte", "+4.1 %"], "a": 1, "e": "Odds-Ratio ≠ Wahrscheinlichkeitsverhältnis."}, {"q": "Tag p = 10 %, Odds-Ratio Nacht 4.1. p in der Nacht ≈ ?", "o": ["41 %", "31 %", "14 %", "50 %"], "a": 1, "e": "Odds 0.111 × 4.1 = 0.456 → p = 0.31."}, {"q": "pressure = 0.08 pro mTorr. Odds-Faktor pro 1 SD (8.28)?", "o": ["1.08", "≈1.94", "0.66", "8.28"], "a": 1, "e": "e^(0.08·8.28) = e^0.66 ≈ 1.94."}, {"q": "Defektrate 25 %. Brier des Nullmodells?", "o": ["0.25", "0.1875", "0.5", "0.0625"], "a": 1, "e": "0.25·0.75."}, {"q": "Brier Modell 0.109, Null 0.1875. Skill?", "o": ["0.109", "≈0.42", "≈0.58", "0.1875"], "a": 1, "e": "1 − 0.109/0.1875 ≈ 0.42."}, {"q": "AUC = 0.86 bedeutet …", "o": ["86 % richtig klassifiziert", "Ein zufälliges defektes Teil bekommt mit 86 % Wahrscheinlichkeit eine höhere Prognose als ein zufälliges gutes", "86 % Defekte erkannt", "Brier 0.14"], "a": 1, "e": "Rangordnung."}, {"q ng wurde auf ALLEN Daten berechnet, bevor gesplittet wurde. Problem?", "o": ["Keines", "Leakage durch Vorverarbeitung (Testinformation fließt ins Training)", "Simpson", "Separation"], "a": 1, "e": "Vorverarbeitung nur auf Training fitten."}, {"q": "Defektrate in den Daten 25 %, im Betrieb typischerweise 3 %. Welche Frage zur Datenentstehung ist zentral?", "o": ["Welcher Prior?", "Wurden Defekte überrepräsentiert (Oversampling/Auswahl)? → Kalibrierung", "Wie viele Chains?", "Welche Farbe?"], "a": 1, "e": "Basisrate."}, {"q": "Welche Maßnahme gehört NICHT zum Monitoring?", "o": ["Brier/AUC auf neuen gelabelten Daten", "Kalibrierung je Maschine", "Mehr MCMC-Samples ziehen", "Eingangsverteilungen vs. Training"], "a": 2, "e": "Samples ändern nichts an Drift."}]}, {"id": "11-Beispielklausur", "titel": "Beispielklausur-Training", "kapitel": "uebungsklausur/A2-Musterloesung.md", "karten": [["Basisfall Klausur-Modell 1", "Maschine M1, Tagschicht, alle Prozesswerte = 0 (0 mTorr, 0 °C, 0 %, 0 s, 0 mm/s) – außerhalb der Daten, nicht interpretierbar → zentrieren."], ["Tabelle Df/Deviance/AIC", "Ausgabe von effectsize() für ein logistisches Modell; großer AIC-Anstieg ohne Variable = wichtig."], ["Wichtigste Variable m1 / m2", "m1: machine (+160 AIC); m2: line_speed (+251 AIC)."], ["M1 vs. M2", "machineM2 0.09 [−0.27; 0.40] schließt 0 ein → nicht unterscheidbar."], ["Nachtschicht", "OR e^1.41 ≈ 4.1 (Odds!), nicht 4× Wahrscheinlichkeit; nicht kausal."], ["Güte m1", "Sampling ok, mean_PPD 0.25, R² 0.37, AUC 0.86/0.86, Brier 0.115/0.109 vs. 0.1875 → Skill ≈ 0.4; aber Nichtlinearität."], ["m2 vs. m1", "R² 0.49, AUC Test 0.917, Brier 0.089, Skill 0.52, elpd-Diff −222.8 (se 24) → m2 klar besser, kein Overfitting."], ["Cutoff Klausur", "TPR ≥ 0.75 → Cutoff ≈ 0.3; ca. 75 % Defekte erkannt, ca. 13 % der guten Teile Fehlalarm."], ["Luftfeuchtigkeit Empfehlung", "≈ 38–47 % (Minimum ≈ 40–42 %), > 50 % vermeiden; Ränder dünn, nicht kausal."], ["Transport vs. Belichtung", "Bei line_speed mehr Vorsicht (größter AIC-Beitrag); Korrelation −0.68 beachten."]], "fragen": [{"q": "In der Klausur: Welche Variable ist in Modell 1 laut AIC-Tabelle am wichtigsten?", "o": ["exposure_time", "pressure", "machine", "temperature"], "a": 2, "e": "AIC ohne machine 2831.6 vs. 2671.1 (+160.5)."}, {"q": "Warum ist der Basisfall von Modell 1 nicht sinnvoll interpretierbar?", "o": ["Weil M1 die beste Maschine ist", "Alle Prozesswerte = 0 liegen weit außerhalb der Daten", "Weil der Intercept negativ ist", "Weil Rhat ≠ 1"], "a": 1, "e": "Zentrieren."}, {"q": "machineM5 1.59 [1.24; 1.96], machineM4 1.43 [1.08; 1.75]. Ist M5 sicher die schlechteste Maschine?", "o": ["Ja", "Nicht eindeutig – Differenz über Samples prüfen", "Nein, M1", "M4 ist sicher schlechter"], "a": 1, "e": "s[,'machineM5'] − s[,'machineM4']."}, {"q": "Die U-förmigen Kurven in Abschnitt 3 zeigen vor allem, dass …", "o": ["Modell 1 overfittet", "Modell 1 nur monotone (lineare) Zusammenhänge abbilden kann – quadratische Terme nötig", "die Daten fehlerhaft sind", "die Maschinen gleich sind"], "a": 1, "e": "Fehlspezifikation."}, {"q": "Warum ist exposure_time2 = 42 nicht automatisch der stärkste Effekt?", "o": ["Weil 42 klein ist", "Einheit Sekunden² und winzige Streuung (SD 0.07 s) – auf gemeinsame Skala bringen", "Weil quadratisch immer schwach ist", "Rundung"], "a": 1, "e": "β₂·SD² ≈ 0.21."}, {"q": "Beide Klausurmodelle nehmen bezüglich Luftfeuchtigkeit und Maschine an, dass …", "o": ["die Feuchtigkeit nur bei M5 wirkt", "die Wirkung der Feuchtigkeit auf allen Maschinen gleich ist (keine Interaktion)", "Maschine kausal ist", "Feuchtigkeit linear wirkt"], "a": 1, "e": "Additiv auf Logit-Skala."}, {"q": "plotlogrates(m2): Bei welchem Cutoff erreicht man TPR = 0.75?", "o": ["≈0.1", "≈0.3", "≈0.5", "≈0.7"], "a": 1, "e": "Abgelesen ≈ 0.28–0.32."}, {"q": "Warum ist ein zufälliger Split in der Klausur problematisch?", "o": ["Weil 70/30 falsch ist", "Daten aus denselben Wochen in Train und Test → Zukunft/Drift nicht geprüft", "Zu wenig Defekte", "Bayes erlaubt keine Splits"], "a": 1, "e": "Besser zeitlicher Split."}]}];
const KEY = "da-quiz-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Alle Items mit stabiler ID
const ITEMS = [];
DATA.forEach(d => {
  d.fragen.forEach((f, i) => ITEMS.push({ type: "mc", deck: d.id, deckTitel: d.titel, id: `${d.id}:q${i}`, ...f }));
  d.karten.forEach((k, i) => ITEMS.push({ type: "card", deck: d.id, deckTitel: d.titel, id: `${d.id}:k${i}`, term: k[0], def: k[1] }));
});

const sel = $("deck");
sel.innerHTML = `<option value="all">Alle Themen gemischt</option>` +
  DATA.map(d => `<option value="${d.id}">${d.id.slice(0, 2)} · ${esc(d.titel)}</option>`).join("");
let mode = "mc", queue = [], pos = 0, score = 0, answered = 0;
try { const last = JSON.parse(localStorage.getItem(KEY + "-ui") || "{}"); if (last.deck) sel.value = last.deck; if (last.mode) mode = last.mode; } catch (e) {}

function stats(id) { return store[id] || { r: 0, w: 0 }; }
function mark(id, ok) { const s = stats(id); ok ? s.r++ : s.w++; s.last = ok ? 1 : 0; store[id] = s; save(); }

function overall() {
  const mcs = ITEMS.filter(i => i.type === "mc");
  const seen = mcs.filter(i => store[i.id]).length;
  const good = mcs.filter(i => store[i.id] && store[i.id].last === 1).length;
  $("overall").textContent = `${good}/${mcs.length} Fragen zuletzt richtig · ${seen} gesehen`;
}

function build() {
  const deck = sel.value;
  let pool = ITEMS.filter(i => deck === "all" || i.deck === deck);
  if (mode === "mc") pool = pool.filter(i => i.type === "mc");
  else if (mode === "card") pool = pool.filter(i => i.type === "card");
  else pool = pool.filter(i => store[i.id] && store[i.id].last === 0);
  queue = shuffle(pool); pos = 0; score = 0; answered = 0;
  ["mc", "card", "wrong"].forEach(m => $("m-" + m).setAttribute("aria-pressed", String(m === mode)));
  try { localStorage.setItem(KEY + "-ui", JSON.stringify({ deck, mode })); } catch (e) {}
  render();
}

function progress() { $("prog").style.width = queue.length ? (100 * pos / queue.length) + "%" : "0"; }

function render() {
  progress(); overall();
  const c = $("card");
  if (!queue.length) {
    c.className = "card done";
    c.innerHTML = mode === "wrong"
      ? `<p class="q">Keine offenen Fehler in diesem Thema.</p><p>Beantworte erst Fragen im Modus „Multiple Choice“. Falsch beantwortete landen hier.</p>`
      : `<p class="q">Für dieses Thema gibt es hier keine Einträge.</p>`;
    return;
  }
  if (pos >= queue.length) {
    c.className = "card done";
    const pct = answered ? Math.round(100 * score / answered) : 0;
    c.innerHTML = `<div class="big">${score}/${answered}</div><p>${pct >= 80 ? "Sehr gut, das sitzt." : pct >= 50 ? "Solide. Wiederhole die Fehler." : "Lies das Kapitel nochmal und wiederhole die Fehler."}</p>
      <div class="row" style="width:100%"><button class="btn primary" id="again">Nochmal mischen</button><button class="btn" id="towrong">Fehler wiederholen</button></div>`;
    $("again").onclick = build;
    $("towrong").onclick = () => { mode = "wrong"; build(); };
    return;
  }
  const it = queue[pos];
  c.className = "card";
  const meta = `<div class="meta"><span>${esc(it.deckTitel)}</span><span>${pos + 1} / ${queue.length}</span></div>`;
  if (it.type === "card") {
    c.innerHTML = `${meta}<p class="term">${esc(it.term)}</p>
      <div id="ans" hidden class="answer">${esc(it.def)}</div>
      <div class="row" id="act"><button class="btn primary" id="show">Antwort zeigen</button></div>`;
    $("show").onclick = () => {
      $("ans").hidden = false;
      $("act").innerHTML = `<button class="btn bad" id="no">Nochmal</button><button class="btn ok" id="yes">Gewusst</button>`;
      $("yes").onclick = () => { mark(it.id, true); score++; answered++; pos++; render(); };
      $("no").onclick = () => { mark(it.id, false); answered++; queue.push(it); pos++; render(); };
      $("yes").focus();
    };
  } else {
    const order = shuffle(it.o.map((t, i) => i));
    c.innerHTML = `${meta}<p class="q">${esc(it.q)}</p>
      <div class="opts">${order.map((oi, k) => `<button class="opt" data-i="${oi}"><b>${"ABCD"[k]}</b><span>${esc(it.o[oi])}</span></button>`).join("")}</div>
      <div id="fb"></div>`;
    c.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const pick = +b.dataset.i, ok = pick === it.a;
      c.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.i === it.a) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      mark(it.id, ok); answered++; if (ok) score++;
      $("fb").innerHTML = `<div class="expl"><strong>${ok ? "Richtig." : "Falsch."}</strong> ${esc(it.e)}</div>
        <div class="row" style="margin-top:12px"><button class="btn primary" id="next">Weiter</button></div>`;
      $("next").onclick = () => { pos++; render(); };
      $("next").focus();
      overall();
    });
  }
}

sel.onchange = build;
$("m-mc").onclick = () => { mode = "mc"; build(); };
$("m-card").onclick = () => { mode = "card"; build(); };
$("m-wrong").onclick = () => { mode = "wrong"; build(); };
$("reset").onclick = () => {
  const b = $("reset");
  if (b.dataset.armed) { store = {}; save(); delete b.dataset.armed; b.textContent = "Fortschritt zurücksetzen"; build(); }
  else { b.dataset.armed = "1"; b.textContent = "Wirklich löschen? Nochmal tippen"; setTimeout(() => { delete b.dataset.armed; b.textContent = "Fortschritt zurücksetzen"; }, 4000); }
};
build();
</script>
